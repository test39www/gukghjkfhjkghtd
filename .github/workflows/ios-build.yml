name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-13

    defaults:
      run:
        working-directory: frontend

    env:
      IOS_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 14.3.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14.3.1"

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install JS dependencies
        run: npm install

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Force iOS deployment target 12.0
        run: |
          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '${IOS_DEPLOYMENT_TARGET}'/" ios/Podfile
          else
            printf "platform :ios, '%s'\n" "${IOS_DEPLOYMENT_TARGET}" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi
          head -n 15 ios/Podfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned app and IPA
        run: bash scripts/ci-build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipad-youtube-client-ipa
          path: frontend/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
