workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18
      xcode: 16.0
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean

      - name: Force iOS deployment target 12.4
        script: |
          cd frontend

          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.4'/" ios/Podfile
          else
            printf "platform :ios, '12.4'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi

          echo "Podfile first lines:"
          head -n 20 ios/Podfile

      - name: Ruby 3.2 compatibility shim (external, not in Podfile)
        script: |
          cd frontend/ios
          cat > podfile_patch.rb <<'RUBY'
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          RUBY

      - name: Patch React Native boost podspec
        script: |
          cd frontend

          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ ! -f "$BOOST_PODSPEC" ]; then
            echo "ERROR: boost.podspec not found"
            exit 1
          fi

          ruby - <<'RUBY'
          path = "node_modules/react-native/third-party-podspecs/boost.podspec"
          content = File.read(path)
          content = content.gsub(
            /spec\.source\s*=\s*\{[^}]+\}/m,
            "spec.source = { :http => 'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41' }"
          )
          File.write(path, content)
          RUBY

          echo "Patched boost.podspec:"
          cat "$BOOST_PODSPEC"

      - name: Clean CocoaPods boost cache
        script: |
          rm -rf ~/Library/Caches/CocoaPods/Pods/External/boost
          rm -rf ~/Library/Caches/CocoaPods/Pods/Release/boost
          pod cache clean boost --all || true

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          RUBYOPT="-r$(pwd)/podfile_patch.rb" pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          cd frontend/ios
          set -e

          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "ERROR: .xcworkspace not found"; exit 1; fi
          echo "Workspace: $WORKSPACE"

          echo "Available schemes:"
          xcodebuild -list -workspace "$WORKSPACE"

          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          if ! xcodebuild -list -workspace "$WORKSPACE" | grep -qx "        $APP_SCHEME"; then
            APP_SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '
              /Schemes:/ {flag=1; next}
              flag && NF {
                gsub(/^ +/,"");
                if ($0 !~ /^Pods/ && $0 !~ /^React/ && $0 !~ /^Expo/ && $0 !~ /^RN/ && $0 !~ /^RCT/) { print; exit }
              }')
          fi
          if [ -z "$APP_SCHEME" ]; then echo "ERROR: App scheme not found"; exit 1; fi
          echo "App scheme: $APP_SCHEME"

          # Plain build (NOT archive). c++17 fixes RCT-Folly json.cpp on Xcode 16.
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.4 \
            CLANG_CXX_LANGUAGE_STANDARD=c++17 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "===== Products dir ====="
          ls -la build/Build/Products/Release-iphoneos/ || true

      - name: Create unsigned IPA
        script: |
          cd frontend/ios
          set -e

          PRODUCTS_DIR="build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: real .app not found in products dir"
            echo "----- full build tree (.app dirs) -----"
            find build -name "*.app" -type d -exec du -sh {} \; || true
            exit 1
          fi

          # Sanity check: the .app MUST contain a Mach-O executable.
          APP_NAME=$(basename "$APP_PATH" .app)
          BIN="$APP_PATH/$APP_NAME"
          echo "App size:"; du -sh "$APP_PATH"
          echo "Contents:"; ls -la "$APP_PATH"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: executable '$BIN' missing -> build produced an empty app"
            exit 1
          fi
          file "$BIN"

          APP_BYTES=$(du -sk "$APP_PATH" | cut -f1)
          if [ "$APP_BYTES" -lt 1000 ]; then
            echo "ERROR: app is only ${APP_BYTES}KB -> not a real build"
            exit 1
          fi

          rm -rf Payload unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r unsigned.ipa Payload >/dev/null

          mkdir -p ../build-output
          cp unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa

          echo "===== Final IPA ====="
          ls -lh ../build-output/ unsigned.ipa

    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
      - frontend/ios/unsigned.ipa
