workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean

      - name: Force iOS deployment target 12.0
        script: |
          cd frontend

          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.0'/" ios/Podfile
          else
            printf "platform :ios, '12.0'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi

          echo "Podfile first lines:"
          head -n 15 ios/Podfile

      - name: Patch old Expo Podfile for Ruby 3.2
        script: |
          cd frontend

          ruby - <<'RUBY'
          podfile = "ios/Podfile"

          patch = <<~'PATCH'
          # Compatibility patch for old Expo SDK 46 on Ruby 3.2+
          # Ruby 3.2 removed File.exists?, but old Expo/CocoaPods scripts still call it.
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          PATCH

          content = File.read(podfile)

          unless content.include?("Compatibility patch for old Expo SDK 46")
            File.write(podfile, patch + "\n\n" + content)
          end
          RUBY

          echo "Patched Podfile:"
          head -n 30 ios/Podfile

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          cd frontend/ios

          WORKSPACE=$(ls *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/ {getline; print $1}')

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        script: |
          cd frontend/ios

          APP_PATH=$(find build -name "*.app" -type d | head -n 1)

          echo "APP_PATH=$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app file not found"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -r unsigned.ipa Payload

          mkdir -p ../build-output
          cp unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa

    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
      - frontend/ios/unsigned.ipa
      - frontend/ios/build/Build/Products/Release-iphoneos/*.app
