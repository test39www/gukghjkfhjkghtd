workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
​
    environment:
      node: 18
      xcode: 16.0
      cocoapods: default
​
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
​
      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean
​
      - name: Force iOS deployment target 12.4
        script: |
          cd frontend
​
          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.4'/" ios/Podfile
          else
            printf "platform :ios, '12.4'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi
​
          echo "Podfile first lines:"
          head -n 20 ios/Podfile
​
      - name: Ruby 3.2 compatibility shim (external, not in Podfile)
        script: |
          cd frontend/ios
​
          # IMPORTANT: do NOT inject `class File` into the Podfile itself.
          # The Podfile is eval'd inside the Pod::Podfile namespace, so `class File`
          # there creates Pod::Podfile::File and breaks File.dirname on the
          # autolinking require line. Load the shim externally via RUBYOPT instead.
          cat > podfile_patch.rb <<'RUBY'
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          RUBY
​
      - name: Patch React Native boost podspec
        script: |
          cd frontend
​
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
​
          if [ ! -f "$BOOST_PODSPEC" ]; then
            echo "ERROR: boost.podspec not found"
            exit 1
          fi
​
          ruby - <<'RUBY'
          path = "node_modules/react-native/third-party-podspecs/boost.podspec"
          content = File.read(path)
          content = content.gsub(
            /spec\.source\s*=\s*\{[^}]+\}/m,
            "spec.source = { :http => 'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41' }"
          )
          File.write(path, content)
          RUBY
​
          echo "Patched boost.podspec:"
          cat "$BOOST_PODSPEC"
​
      - name: Clean CocoaPods boost cache
        script: |
          rm -rf ~/Library/Caches/CocoaPods/Pods/External/boost
          rm -rf ~/Library/Caches/CocoaPods/Pods/Release/boost
          pod cache clean boost --all || true
​
      - name: Install CocoaPods
        script: |
          cd frontend/ios
          RUBYOPT="-r$(pwd)/podfile_patch.rb" pod install --repo-update
​
      - name: Build unsigned iOS app
        script: |
          cd frontend/ios
​
          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: .xcworkspace not found"
            exit 1
          fi
          echo "Workspace: $WORKSPACE"
​
          echo "Available schemes:"
          xcodebuild -list -workspace "$WORKSPACE"
​
          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          if ! xcodebuild -list -workspace "$WORKSPACE" | grep -q "$APP_SCHEME"; then
            echo "Workspace-name scheme not found, detecting non-Pods scheme..."
            APP_SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '
              /Schemes:/ {flag=1; next}
              flag && NF {
                if ($1 !~ /^Pods/ && $1 !~ /^React/ && $1 !~ /^Expo/) { print $1; exit }
              }')
          fi
          if [ -z "$APP_SCHEME" ]; then
            echo "ERROR: App scheme not found"
            exit 1
          fi
          echo "App scheme: $APP_SCHEME"
​
          # Use plain `build` (NOT `archive`): an unsigned IPA does not need an
          # .xcarchive, and archive rebuilds with settings that break RCT-Folly.
          # CLANG_CXX_LANGUAGE_STANDARD=c++17 fixes RCT-Folly json.cpp on Xcode 16
          # (c++20 removed std::char_traits<unsigned char>).
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.4 \
            CLANG_CXX_LANGUAGE_STANDARD=c++17 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
​
          echo "Looking for .app:"
          find build -name "*.app" -type d
​
      - name: Create unsigned IPA
        script: |
          cd frontend/ios
​
          APP_PATH=$(find build -name "*.app" -type d | grep -v "/Pods" | head -n 1)
          echo "APP_PATH=$APP_PATH"
​
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app file not found"
            find build -maxdepth 8 -type d || true
            exit 1
          fi
​
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r unsigned.ipa Payload
​
          mkdir -p ../build-output
          cp unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa
​
          echo "IPA created:"
          ls -lh ../build-output/
​
    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
      - frontend/ios/unsigned.ipa
      - frontend/ios/build/Build/Products/Release-iphoneos/*.app
​
