workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18
      xcode: 16.0
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean

      - name: Force iOS deployment target 12.4
        script: |
          cd frontend

          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.4'/" ios/Podfile
          else
            printf "platform :ios, '12.4'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi

          head -n 20 ios/Podfile

      - name: Patch old Expo SDK 46 for new Ruby
        script: |
          cd frontend

          ruby - <<'RUBY'
          podfile = "ios/Podfile"

          patch = <<~'PATCH'
          # Compatibility patch for old Expo SDK 46 on Ruby 3.2+
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          PATCH

          content = File.read(podfile)

          unless content.include?("Compatibility patch for old Expo SDK 46")
            File.write(podfile, patch + "\n\n" + content)
          end
          RUBY

      - name: Patch React Native boost podspec
        script: |
          cd frontend

          ruby - <<'RUBY'
          path = "node_modules/react-native/third-party-podspecs/boost.podspec"
          content = File.read(path)

          content = content.gsub(
            /spec\.source\s*=\s*\{[^}]+\}/m,
            "spec.source = { :http => 'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41' }"
          )

          File.write(path, content)
          RUBY

      - name: Clean CocoaPods boost cache
        script: |
          rm -rf ~/Library/Caches/CocoaPods/Pods/External/boost
          rm -rf ~/Library/Caches/CocoaPods/Pods/Release/boost
          pod cache clean boost --all || true

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          cd frontend/ios

          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: .xcworkspace not found"
            exit 1
          fi

          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $APP_SCHEME"

          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "Release products:"
          ls -lah build/Build/Products/Release-iphoneos || true

          echo "Apps in Release-iphoneos:"
          find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d -print || true

      - name: Create unsigned IPA
        script: |
          cd frontend/ios

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)

          echo "APP_PATH=$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: real .app not found in Release-iphoneos"
            find build -name "*.app" -type d -print || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist not found. This is not a real app."
            ls -lah "$APP_PATH"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)

          if [ ! -f "$APP_PATH/$APP_NAME" ]; then
            echo "WARNING: executable with app name not found, listing app contents:"
            ls -lah "$APP_PATH"
          fi

          echo "Real app size:"
          du -sh "$APP_PATH"
          find "$APP_PATH" -maxdepth 2 -type f | head -n 50

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -qry ipad-youtube-client-unsigned.ipa Payload

          echo "IPA size:"
          ls -lh ipad-youtube-client-unsigned.ipa

          mkdir -p ../build-output
          cp ipad-youtube-client-unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa

    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
