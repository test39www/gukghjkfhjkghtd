workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18
      xcode: 16.0
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean

      - name: Force iOS deployment target 12.4
        script: |
          cd frontend

          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.4'/" ios/Podfile
          else
            printf "platform :ios, '12.4'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi

          head -n 20 ios/Podfile

      - name: Patch old Expo SDK 46 for new Ruby
        script: |
          cd frontend

          ruby - <<'RUBY'
          podfile = "ios/Podfile"

          patch = <<~'PATCH'
          # Compatibility patch for old Expo SDK 46 on Ruby 3.2+
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          PATCH

          content = File.read(podfile)

          unless content.include?("Compatibility patch for old Expo SDK 46")
            File.write(podfile, patch + "\n\n" + content)
          end
          RUBY

      - name: Patch React Native boost podspec
        script: |
          cd frontend

          ruby - <<'RUBY'
          path = "node_modules/react-native/third-party-podspecs/boost.podspec"
          content = File.read(path)

          content = content.gsub(
            /spec\.source\s*=\s*\{[^}]+\}/m,
            "spec.source = { :http => 'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41' }"
          )

          File.write(path, content)
          RUBY

      - name: Clean CocoaPods boost cache
        script: |
          rm -rf ~/Library/Caches/CocoaPods/Pods/External/boost
          rm -rf ~/Library/Caches/CocoaPods/Pods/Release/boost
          pod cache clean boost --all || true

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install --repo-update

      - name: Archive unsigned iOS app
        script: |
          cd frontend/ios

          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: .xcworkspace not found"
            exit 1
          fi

          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $APP_SCHEME"

          rm -rf build
          mkdir -p build

          xcodebuild clean archive \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/iPadYouTubeClient.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=12.4 \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "Archive contents:"
          find build/iPadYouTubeClient.xcarchive -maxdepth 5 -type d | head -n 100

          echo "Apps inside archive:"
          find build/iPadYouTubeClient.xcarchive -name "*.app" -type d -print

      - name: Create unsigned IPA
        script: |
          cd frontend/ios

          APP_PATH=$(find build/iPadYouTubeClient.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -n 1)

          echo "APP_PATH=$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found inside archive"
            find build -name "*.app" -type d -print || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist not found. This is not a real app."
            ls -lah "$APP_PATH"
            exit 1
          fi

          echo "Real app size:"
          du -sh "$APP_PATH"

          echo "App contents:"
          ls -lah "$APP_PATH" | head -n 50

          echo "Ad-hoc signing frameworks and app for jailbreak/AppSync..."
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type f -perm +111 -exec codesign --force --sign - --timestamp=none {} \; || true
            find "$APP_PATH/Frameworks" -name "*.framework" -type d -exec codesign --force --sign - --timestamp=none {} \; || true
          fi

          codesign --force --sign - --timestamp=none "$APP_PATH" || true

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -qry ipad-youtube-client-unsigned.ipa Payload

          echo "IPA size:"
          ls -lh ipad-youtube-client-unsigned.ipa

          mkdir -p ../build-output
          cp ipad-youtube-client-unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa

    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
