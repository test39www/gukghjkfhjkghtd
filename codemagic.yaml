workflows:
  ios-unsigned:
    name: Build iOS IPA unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 18
      xcode: 16.0
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate iOS project
        script: |
          cd frontend
          export CI=1
          export EXPO_NO_TELEMETRY=1
          npx expo prebuild --platform ios --clean

      - name: Fix node path for Xcode bundle phase
        script: |
          cd frontend
          NODE_PATH=$(command -v node)
          echo "Using node at: $NODE_PATH"
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          cat ios/.xcode.env

      - name: Force iOS deployment target 12.4
        script: |
          cd frontend
          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/platform :ios.*/platform :ios, '12.4'/" ios/Podfile
          else
            printf "platform :ios, '12.4'\n" | cat - ios/Podfile > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
          fi
          head -n 20 ios/Podfile

      - name: Patch Podfile - folly libc++ fix (Xcode 16)
        script: |
          cd frontend
          cat > inject_folly_fix.rb <<'RUBY'
          podfile = "ios/Podfile"
          content = File.read(podfile)
          marker  = "# folly-libcpp-fix"
          inject = <<~PATCH
            #{marker}
            installer.pods_project.targets.each do |__t|
              __t.build_configurations.each do |__c|
                defs = __c.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] || ['$(inherited)']
                defs = [defs] unless defs.is_a?(Array)
                unless defs.include?('_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION=1')
                  defs << '_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION=1'
                end
                __c.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] = defs
                __c.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'
              end
            end
          PATCH
          if content.include?(marker)
            puts "folly fix already present"
          elsif content =~ /post_install do \|installer\|/
            content = content.sub(/post_install do \|installer\|/) { |m| "#{m}\n#{inject}" }
            File.write(podfile, content)
            puts "folly fix injected into existing post_install"
          else
            content << "\n\npost_install do |installer|\n#{inject}\nend\n"
            File.write(podfile, content)
            puts "folly fix appended as new post_install"
          end
          RUBY
          ruby inject_folly_fix.rb
          grep -n "folly-libcpp-fix\|post_install\|_LIBCPP_ENABLE" ios/Podfile || true

      - name: Ruby 3.2 compatibility shim (external, not in Podfile)
        script: |
          cd frontend/ios
          cat > podfile_patch.rb <<'RUBY'
          class File
            def self.exists?(path)
              exist?(path)
            end
          end unless File.respond_to?(:exists?)
          RUBY

      - name: Patch React Native boost podspec
        script: |
          cd frontend
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ ! -f "$BOOST_PODSPEC" ]; then echo "ERROR: boost.podspec not found"; exit 1; fi
          ruby - <<'RUBY'
          path = "node_modules/react-native/third-party-podspecs/boost.podspec"
          content = File.read(path)
          content = content.gsub(
            /spec\.source\s*=\s*\{[^}]+\}/m,
            "spec.source = { :http => 'https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41' }"
          )
          File.write(path, content)
          RUBY
          cat "$BOOST_PODSPEC"

      - name: Clean CocoaPods boost cache
        script: |
          rm -rf ~/Library/Caches/CocoaPods/Pods/External/boost
          rm -rf ~/Library/Caches/CocoaPods/Pods/Release/boost
          pod cache clean boost --all || true

      - name: Install CocoaPods
        script: |
          cd frontend/ios
          RUBYOPT="-r$(pwd)/podfile_patch.rb" pod install --repo-update

      - name: Weak-link SwiftUI/Combine for iOS 12 (fix dyld launch crash)
        script: |
          cd frontend/ios
          set -e
          # expo-modules-core imports SwiftUI; static linking makes it a HARD
          # dependency in the main binary -> dyld crash on iOS 12 (no SwiftUI).
          # Make it weak so the app launches; SwiftUI code is @available-guarded.
          FOUND=0
          find "Pods/Target Support Files" -name "Pods-*.xcconfig" | while read -r f; do
            echo "Patching OTHER_LDFLAGS in: $f"
            if grep -q '^OTHER_LDFLAGS' "$f"; then
              sed -i '' 's|^OTHER_LDFLAGS = .*|& -weak_framework "SwiftUI" -weak_framework "Combine"|' "$f"
            else
              echo 'OTHER_LDFLAGS = $(inherited) -weak_framework "SwiftUI" -weak_framework "Combine"' >> "$f"
            fi
            grep -n '^OTHER_LDFLAGS' "$f" || true
          done
          # sanity check that at least one aggregate xcconfig exists
          if ! find "Pods/Target Support Files" -name "Pods-*.xcconfig" | grep -q .; then
            echo "WARNING: no Pods-*.xcconfig found to patch"
          fi

      - name: Pre-bundle JS (diagnostic, real Metro errors surface here)
        script: |
          cd frontend
          ENTRY=$(node -e "console.log(require('./package.json').main || 'index.js')")
          echo "Entry file: $ENTRY"
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file "$ENTRY" \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/assets
          echo "JS bundle built OK:"
          ls -lh ios/main.jsbundle

      - name: Build unsigned iOS app
        script: |
          cd frontend/ios
          set -e
          export NODE_BINARY="$(command -v node)"
          echo "NODE_BINARY=$NODE_BINARY"

          WORKSPACE=$(find . -maxdepth 1 -type d -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "ERROR: .xcworkspace not found"; exit 1; fi
          echo "Workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          if ! xcodebuild -list -workspace "$WORKSPACE" | grep -qx "        $APP_SCHEME"; then
            APP_SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '
              /Schemes:/ {flag=1; next}
              flag && NF {
                gsub(/^ +/,"");
                if ($0 !~ /^Pods/ && $0 !~ /^React/ && $0 !~ /^Expo/ && $0 !~ /^RN/ && $0 !~ /^RCT/) { print; exit }
              }')
          fi
          if [ -z "$APP_SCHEME" ]; then echo "ERROR: App scheme not found"; exit 1; fi
          echo "App scheme: $APP_SCHEME"

          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.4 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          ls -la build/Build/Products/Release-iphoneos/ || true

      - name: Ad-hoc sign and create IPA (for jailbroken + AppSync)
        script: |
          cd frontend/ios
          set -e

          PRODUCTS_DIR="build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: real .app not found"
            find build -name "*.app" -type d -exec du -sh {} \; || true
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)
          BIN="$APP_PATH/$APP_NAME"
          du -sh "$APP_PATH"; ls -la "$APP_PATH"
          if [ ! -f "$BIN" ]; then echo "ERROR: executable missing -> empty app"; exit 1; fi
          file "$BIN"

          # confirm SwiftUI is now weak (LC_LOAD_WEAK_DYLIB), not a hard dep
          echo "----- SwiftUI load command in binary -----"
          otool -l "$BIN" | grep -A2 -i swiftui || echo "(SwiftUI not referenced)"

          APP_BYTES=$(du -sk "$APP_PATH" | cut -f1)
          if [ "$APP_BYTES" -lt 1000 ]; then echo "ERROR: app only ${APP_BYTES}KB"; exit 1; fi

          # ---- Ad-hoc (fake) signature with entitlements ----
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          cat > entitlements.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>$BUNDLE_ID</string>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          PLIST

          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) | while read -r f; do
              echo "Signing nested: $f"
              codesign --force --sign - "$f" || true
            done
          fi
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -maxdepth 1 -name "*.appex" | while read -r p; do
              codesign --force --sign - --entitlements entitlements.plist "$p" || true
            done
          fi

          codesign --force --sign - --entitlements entitlements.plist "$APP_PATH"
          echo "----- verifying entitlements -----"
          codesign -d --entitlements - "$APP_PATH" || true

          rm -rf Payload unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr unsigned.ipa Payload

          mkdir -p ../build-output
          cp unsigned.ipa ../build-output/ipad-youtube-client-unsigned.ipa
          echo "===== Final IPA ====="
          ls -lh ../build-output/ unsigned.ipa

    artifacts:
      - frontend/build-output/ipad-youtube-client-unsigned.ipa
      - frontend/ios/unsigned.ipa
